# Local AI — machine-agnostic llama.cpp + Open WebUI
# -----------------------------------------------------------------------------
# One stack, three GPU profiles. `local-ai.sh` picks the right profile at boot
# by probing the machine (nvidia-smi / /dev/dri / plain CPU). Only ONE profile
# is active at a time:
#
#   cpu     ghcr.io/ggml-org/llama.cpp:server         any machine (fallback)
#   nvidia  ghcr.io/ggml-org/llama.cpp:server-cuda    NVIDIA GPU (CUDA)
#   vulkan  ghcr.io/ggml-org/llama.cpp:server-vulkan  AMD / Intel GPU (Vulkan)
#
# Optional vision support: add docker-compose.vision.yaml with `-f` (local-ai.sh
# does this automatically when the mmproj projector is present on disk).
#
# Security note: every published port binds to 127.0.0.1 by design, so the
# stack is reachable only from this machine unless you override the bind.
# -----------------------------------------------------------------------------
name: local-ai

x-llama-common: &llama-common
  container_name: local-ai-llama-server
  networks:
    default:
      aliases:
        - llama-backend
  volumes:
    - ${LOCALAI_MODEL_DIR:-~/ai-models}:/models:ro
  ports:
    - "127.0.0.1:${LOCALAI_LLAMA_PORT:-18080}:18080"
  command:
    - --model
    - /models/${LOCALAI_MODEL_FILE:-Huihui-Qwen3.5-2B-abliterated.Q4_K_M.gguf}
    - --host
    - "0.0.0.0"
    - --port
    - "18080"
    - --ctx-size
    - "${LOCALAI_CTX:-8192}"
    - --alias
    - "${LOCALAI_MODEL_ALIAS:-Qwen3.5-2B-Abliterated (Uncensored)}"
    - --reasoning
    - "${LOCALAI_REASONING:-off}"
    - --parallel
    - "1"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/health >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 36
    start_period: 30s
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ CPU ---
  llama-cpu:
    <<: *llama-common
    profiles: ["cpu"]
    image: ghcr.io/ggml-org/llama.cpp:server

  # --------------------------------------------------------------- NVIDIA ---
  llama-nvidia:
    <<: *llama-common
    profiles: ["nvidia"]
    image: ghcr.io/ggml-org/llama.cpp:${LOCALAI_LLAMA_IMAGE_TAG:-server-cuda}
    gpus: all
    command:
      - --model
      - /models/${LOCALAI_MODEL_FILE:-Huihui-Qwen3.5-2B-abliterated.Q4_K_M.gguf}
      - --host
      - "0.0.0.0"
      - --port
      - "18080"
      - --ctx-size
      - "${LOCALAI_CTX:-16384}"
      - --alias
      - "${LOCALAI_MODEL_ALIAS:-Qwen3.5-2B-Abliterated (Uncensored)}"
      - --reasoning
      - "${LOCALAI_REASONING:-off}"
      - --n-gpu-layers
      - "999"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q4_0
      - --cache-type-v
      - q4_0
      - --parallel
      - "1"

  # --------------------------------------------------------- AMD / Intel ----
  llama-vulkan:
    <<: *llama-common
    profiles: ["vulkan"]
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    devices:
      - /dev/dri
    command:
      - --model
      - /models/${LOCALAI_MODEL_FILE:-Huihui-Qwen3.5-2B-abliterated.Q4_K_M.gguf}
      - --host
      - "0.0.0.0"
      - --port
      - "18080"
      - --ctx-size
      - "${LOCALAI_CTX:-16384}"
      - --alias
      - "${LOCALAI_MODEL_ALIAS:-Qwen3.5-2B-Abliterated (Uncensored)}"
      - --reasoning
      - "${LOCALAI_REASONING:-off}"
      - --n-gpu-layers
      - "999"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q4_0
      - --cache-type-v
      - q4_0
      - --parallel
      - "1"

  # ------------------------------------------------------------- Web UI ----
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: local-ai-open-webui
    profiles: ["cpu", "nvidia", "vulkan"]
    volumes:
      - local-ai-webui-data:/app/backend/data
    ports:
      - "${LOCALAI_WEBUI_BIND:-127.0.0.1}:${LOCALAI_WEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: ${LOCALAI_OPENAI_BASE:-http://llama-backend:18080/v1}
      OPENAI_API_KEY: ${LOCALAI_API_KEY:-local-ai}
      WEBUI_AUTH: "${LOCALAI_WEBUI_AUTH:-false}"
      WEBUI_NAME: Local AI
      ANONYMIZED_TELEMETRY: "false"
      ENABLE_OLLAMA_API: "false"
    restart: unless-stopped

volumes:
  local-ai-webui-data:
